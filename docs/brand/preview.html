<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1600px;height:900px;display:grid;grid-template-columns:1fr 1fr;font-family:-apple-system,"Helvetica Neue",sans-serif}
.p{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.d{background:#0e0f15}.l{background:#fff}
.row{display:flex;gap:28px;align-items:center}
.lock{display:flex;align-items:center;gap:22px;font-size:64px;font-weight:750;letter-spacing:-0.03em}
.d .lock{color:#eeedf5}.l .lock{color:#15151d}
.l .ic{box-shadow:0 0 0 1px #dcdce8;border-radius:23%}
</style></head><body>
<div class="p d"><div class="lock"><img src="voxmesh-mark.svg" width="96">VoxMesh</div>
<div class="row"><img src="voxmesh-icon-dark.svg" width="160"><img src="voxmesh-mark.svg" width="96"><img src="voxmesh-mark.svg" width="48"><img src="voxmesh-mark.svg" width="32"><img src="voxmesh-mark.svg" width="16"></div></div>
<div class="p l"><div class="lock"><img src="voxmesh-mark-on-light.svg" width="96">VoxMesh</div>
<div class="row"><img class="ic" src="voxmesh-icon-light.svg" width="160"><img src="voxmesh-mark-on-light.svg" width="96"><img src="voxmesh-mark-on-light.svg" width="48"><img src="voxmesh-mark-on-light.svg" width="32"><img src="voxmesh-mark-on-light.svg" width="16"></div></div>
</body></html>
